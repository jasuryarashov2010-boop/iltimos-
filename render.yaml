services:
  - type: web
    name: kitobxon-v10
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_BASE_URL
        fromService:
          type: web
          name: kitobxon-v10
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: kitobxon-v10-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kitobxon-v10-redis
          property: connectionString
      - key: FORCE_SUBSCRIPTION
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"

  - type: keyvalue
    name: kitobxon-v10-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: "Render internal/private network access"

databases:
  - name: kitobxon-v10-db
    plan: free
    postgresMajorVersion: "17"
